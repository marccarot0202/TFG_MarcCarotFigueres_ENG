<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"></stop>
      <stop offset="100%" stop-color="#18181b"></stop>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5FF"></stop>
      <stop offset="100%" stop-color="#6D5EFF"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg)"></rect>

  <g filter="url(#glow)">
    <polygon points="256,90 380,160 380,352 256,422 132,352 132,160" fill="none" stroke="url(#neon)" stroke-width="18"></polygon>

    <polygon points="256,150 325,190 325,270 256,310 187,270 187,190" fill="none" stroke="url(#neon)" stroke-width="14"></polygon>

    <circle cx="256" cy="230" r="22" fill="#00F5FF"></circle>

    <path d="M256 310V370" stroke="#00F5FF" stroke-width="14" stroke-linecap="round"></path>
  </g>
</svg>